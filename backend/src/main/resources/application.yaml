spring:
  application:
    name: fintrack

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/fintrack_db}
    username: ${SPRING_DATASOURCE_USERNAME:fintrack_user}
    password: ${SPRING_DATASOURCE_PASSWORD:1202}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

server:
  port: 8080