spring:
  application:
    name: fintrack

  datasource:
    url: jdbc:mysql://localhost:3306/fintrack_db
    username: fintrack_user
    password: 1202
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

server:
  port: 8080